services:
  webtop:
    image: ${WEBTOP_IMAGE:-ghcr.io/joshyorko/webtop-os:work-jatt}
    pull_policy: missing
    env_file:
      - path: .env
        required: false
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    ports:
      - "127.0.0.1:${WEBTOP_PORT:-3010}:3000"
      - "127.0.0.1:${WEBTOP_HTTPS_PORT:-3011}:3001"
    devices:
      - /dev/dri:/dev/dri
    shm_size: 4gb
    volumes:
      - ../..:/workspaces/work-jatt
      - type: volume
        source: webtop-home
        target: /config
        volume:
          nocopy: true

volumes:
  webtop-home:
