name: work-jatt-webtop

services:
  webtop:
    image: ${WEBTOP_IMAGE:-ghcr.io/joshyorko/webtop-os:work-jatt-dogfood}
    pull_policy: missing
    environment:
      PUID: ${WEBTOP_PUID:-1000}
      PGID: ${WEBTOP_PGID:-1000}
      WEBTOP_USER: ${WEBTOP_USER:-kdlocpanda}
      WEBTOP_GIT_NAME: ${WEBTOP_GIT_NAME:-joshyorko}
      WEBTOP_GIT_EMAIL: ${WEBTOP_GIT_EMAIL:-joshyorko@users.noreply.github.com}
      TITLE: Work-Jatt Webtop
      PIXELFLUX_WAYLAND: "true"
      SELKIES_MICROPHONE_ENABLED: ${WEBTOP_MICROPHONE_ENABLED:-false}
      SELKIES_MICROPHONE_ON_START: "false"
    devices:
      - /dev/dri:/dev/dri
    ports:
      - "127.0.0.1:${WEBTOP_HTTP_PORT:-13000}:3000"
      - "127.0.0.1:${WEBTOP_HTTPS_PORT:-13001}:3001"
    shm_size: 4gb
    volumes:
      - type: bind
        source: ../..
        target: /workspaces/work-jatt
        bind:
          create_host_path: false
      - type: volume
        source: work-jatt-webtop-config
        target: /config
        volume:
          nocopy: true

volumes:
  work-jatt-webtop-config:
    name: ${WEBTOP_CONFIG_VOLUME:-work-jatt-webtop-config}
